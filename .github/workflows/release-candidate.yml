name: Release candidate

# Produces the immutable release artifact and its manifest, and (opt-in) uploads it to the private
# R2 bucket games-site serves from. It never edits games-site's catalog and never promotes
# production (WC-PROMOTE). Preview selection uses WEATHER_COMMAND_PREVIEW_VERSION only.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable candidate version, for example 0.1.0-qualification.1
        required: true
        type: string
      publish_to_r2:
        description: Upload to private R2 (requires weather-command-qualification environment secrets)
        required: false
        default: false
        type: boolean

concurrency:
  group: weather-command-candidate-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require the immutable candidate version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^0\.1\.0-qualification\.[0-9]+$ ]] || {
            echo "Version must use the immutable 0.1.0-qualification.N format."
            exit 1
          }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run test:e2e
      - run: npm run test:host
      - run: npm run release:build
        env:
          GAME_RELEASE_VERSION: ${{ inputs.version }}
          GAME_COMMIT_SHA: ${{ github.sha }}
      - run: npm run release:check
        env:
          GAME_RELEASE_VERSION: ${{ inputs.version }}
          GAME_COMMIT_SHA: ${{ github.sha }}
      - name: Record the artifact identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "version: $VERSION"
          echo "source SHA: ${{ github.sha }}"
          echo "entry: index.html"
          echo "payload files: $(find dist -type f | wc -l)"
          node -e "const m=require('./dist/release-manifest.json');console.log('manifest commit:',m.commit,'lockfile:',m.lockfile?.sha256?.slice(0,12))"
      - uses: actions/upload-artifact@v4
        with:
          name: weather-command-${{ inputs.version }}
          path: dist
          retention-days: 30

  publish-r2:
    if: ${{ inputs.publish_to_r2 }}
    needs: validate
    runs-on: ubuntu-latest
    environment: weather-command-qualification
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weather-command-${{ inputs.version }}
          path: dist
      - name: Install Wrangler
        run: npm install --global wrangler@4.134.0
      - name: Upload immutable candidate to private R2
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          prefix="weather-command/${VERSION}"
          mapfile -d '' files < <(find dist -type f ! -name release-manifest.json -print0 | sort -z)
          files+=(dist/release-manifest.json)

          for file in "${files[@]}"; do
            relative="${file#dist/}"
            key="setnessconsulting-games/${prefix}/${relative}"
            set +e
            output="$(wrangler r2 object get "$key" --remote --pipe 2>&1 >/dev/null)"
            status=$?
            set -e
            if [[ $status -eq 0 ]]; then
              echo "Refusing to overwrite immutable R2 object: ${key}"
              exit 1
            fi
            if [[ "$output" != *"The specified key does not exist."* ]]; then
              echo "Could not confirm the R2 object is absent: ${key}"
              echo "$output"
              exit 1
            fi
          done

          for file in "${files[@]}"; do
            relative="${file#dist/}"
            content_type="$(file --brief --mime-type "$file")"
            wrangler r2 object put "setnessconsulting-games/${prefix}/${relative}" \
              --file="$file" \
              --content-type="$content_type" \
              --cache-control="public, max-age=31536000, immutable" \
              --remote
          done
